name: Go checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: gofmt -l cmd internal | tee /tmp/gofmt-files && test ! -s /tmp/gofmt-files
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
